
## JDBC selector
#% type = STRING
jdbc.selector = jdbc1

## using data source (ex. jdbc/CustomDataSourceName)
#% type = STRING
jdbc.dataSourceName =

## jdbc1 - mySQL or mariaDB
#% type = STRING
jdbc1.driverClassName = com.mysql.cj.jdbc.Driver

#% type = STRING
jdbc1.url = jdbc:mysql://192.168.1.1:3306/scheme?nullCatalogMeansCurrent=true&sessionVariables=sql_mode=ANSI_QUOTES

#% type = STRING
jdbc1.username = techuser

#? secure = true; onlinemodifiable = true
#% type = STRING;
jdbc1.password = initialPassword

## jdbc2 - MS SQL
#% type = STRING
jdbc2.driverClassName = com.microsoft.sqlserver.jdbc.SQLServerDriver

#% type = STRING
jdbc2.url = jdbc:sqlserver://192.168.1.1:1433;databaseName=intellect;encrypt=false;trustServerCertificate=true

#% type = STRING
jdbc2.username = techuser

#? secure = true; onlinemodifiable = true
#% type = STRING;
jdbc2.password = initialPassword

## The unique ID of the cluster element.
#! The identification number of the cluster element. The ID is
#! unique for the cluster. Do not modify this property. Assigned at
#! installation time.
#? parameterized = true; computed = true;
#% type = LONG; range = [1-2147483647]
element.clusterId = ${INSTANCE_ID}50 + ${NODE_INDEX}

## Central directory for file logs
#! The place for easy logs
#? onlinemodifiable = true; parameterized = true; computed = true; 
centralFileLogDirectory=/usr/sap/${SYSTEM_NAME}/SYS/global/xi_customer_logs/echoadapter
